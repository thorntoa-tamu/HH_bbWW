analysis: hh_bbww
type: resonant
model:
  parameters: [ MX ]
  param_dependent_bkg: true
  input_file_pattern: ${ERA}/DNN_m${MX}_vs_HME/DNN_m${MX}_vs_HME.root
signalFractionForRelevantBins: 0.2
eras:
  - Run3_2022
  - Run3_2022EE
  - Run3_2023
  - Run3_2023BPix
channels:
  - muMu
  - eMu
  - eE
# The datacard bins, which are what CI_binning_2d.yaml's single slice produces: one
# bin per channel and base category, named by the pattern below.
categories:
  - OS_Iso/res2b_dnn0
  - OS_Iso/recovery_dnn0

# How to take those names apart again. Must match CI_binning_2d.yaml's category_pattern.
category_pattern: "{base_category}_dnn{slice_idx}"

# The CI reads the 2D DNN-vs-HME plane, as the production configuration does, and cuts
# it with the same script -- so the chain the CI exercises is the chain that runs for
# real, PreprocessShapesTask included. What differs is only the binning it is given:
# CI_binning_2d.yaml collapses the plane into one bin with every gate off, because at
# --test statistics (--nEvents 1000, so every yield is ~1e-3 of nominal) the production
# floors would reject every category, and a per-bin distribution that is mostly empty or
# negative is not something combine will fit.
preprocess:
  script: StatInference/bin_opt_2d/rebin_2d.py
  args:
    - --binning-config
    - config/Datacards/CI_binning_2d.yaml
processes:
  - process: data_obs
    is_data: true
    is_asimov_data: true
  - process: XtoHHto2B2W_2L_${MX} # GluGluToRadion2L_${MX}
    hist_name: XtoHHto2B2W_2L_${MX} # GluGluToRadion2L_${MX}
    param_values: [ 300 ]
    is_signal: true
  # Only the t#bar{t} background. custom_CI_Background_DY is produced, merged, histogrammed
  # and plotted by the integration test, but it is not valid input for a limit here: it is an
  # amc@NLO sample, so it carries negative event weights, and `--test 1000` leaves too few
  # events for them to cancel — the single-bin histogram came out -1669 +/- 2817, compatible
  # with zero at 0.6 sigma but negative, which makes the datacard job flaky by construction.
  - custom_CI_Background_TT
uncertainties:
  # Split per year rather than per era: the luminosity calibration is a per-year
  # measurement, so 2022 and 2022EE share a nuisance and 2023 and 2023BPix share
  # another. This is lnN, so it needs nothing from the producer -- the meta-era lnN
  # path already evaluates `eras:` against the sub-eras.
  #
  # NOTE: both magnitudes are still the old flat 1.4%. Only the correlation model has
  # been fixed here; the per-year values need to be taken from the current LUM
  # recommendation (which also splits a correlated from an uncorrelated component,
  # not implemented here).
  - name: lumi_13p6TeV_2022
    type: lnN
    eras:
      - Run3_2022
      - Run3_2022EE
    value: 0.014 # https://twiki.cern.ch/twiki/bin/view/CMS/LumiRecommendationsRun3
  - name: lumi_13p6TeV_2023
    type: lnN
    eras:
      - Run3_2023
      - Run3_2023BPix
    value: 0.014 # TODO: per-year LUM value


  - name: CMS_eff_m_id_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_eff_m_id_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_eff_m_id_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_eff_m_id_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_eff_m_id_iso_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_eff_m_id_iso_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_eff_m_id_iso_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_eff_m_id_iso_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: EleID_TightIDIso_2022
    type: shape
    eras:
      - Run3_2022
  - name: EleID_TightIDIso_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: EleID_TightIDIso_2023
    type: shape
    eras:
      - Run3_2023
  - name: EleID_TightIDIso_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  - name: SingleEleTrg_2022
    type: shape
    eras:
      - Run3_2022
  - name: SingleEleTrg_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: SingleEleTrg_2023
    type: shape
    eras:
      - Run3_2023
  - name: SingleEleTrg_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: SingleMuonTrg_2022
    type: shape
    eras:
      - Run3_2022
  - name: SingleMuonTrg_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: SingleMuonTrg_2023
    type: shape
    eras:
      - Run3_2023
  - name: SingleMuonTrg_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  # Decorrelated per era: the pileup profile and the minimum-bias cross section
  # are derived per era. The era suffix is produced by config/Run3_<era>/weights.yaml
  # -- the nuisance name is also the histogram name, so it cannot be added here.
  - name: CMS_pileup_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_pileup_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_pileup_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_pileup_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  # BTV shape calibration, registered in config/Run3_*/weights.yaml. Correlated
  # across the four Run 3 eras -- the BTV per-era split of the *stats* sources needs
  # meta-era support that dc_make does not have yet (see docs/stat_inference.md).
  # In boosted categories the variation is neutralised at weight level, so these are
  # dropped there automatically by the canIgnore threshold.
  - name: CMS_btag_LF
    type: shape
  - name: CMS_btag_HF
    type: shape
  - name: CMS_btag_lfstats1_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_lfstats1_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_lfstats1_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_lfstats1_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_btag_lfstats2_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_lfstats2_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_lfstats2_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_lfstats2_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_btag_hfstats1_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_hfstats1_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_hfstats1_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_hfstats1_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_btag_hfstats2_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_hfstats2_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_hfstats2_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_hfstats2_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_btag_cferr1
    type: shape
  - name: CMS_btag_cferr2
    type: shape

  # AK8 calibration, registered in config/Run3_*/weights.yaml. Neutralised at
  # weight level for resolved events, so canIgnore drops these outside boosted.
  # Decorrelated: Corrections/fatjet.py loads one of four separate calibration files,
  # so these are four independent fits.
  - name: CMS_bbww_ak8_Hbb_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_bbww_ak8_Hbb_2022EE
    type: shape
    eras:
