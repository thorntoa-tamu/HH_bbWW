  # Pileup
  - name: CMS_pileup_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_pileup_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_pileup_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_pileup_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  # AK4 BTagging
  - name: CMS_btag_LF
    type: shape

  - name: CMS_btag_HF
    type: shape

  - name: CMS_btag_lfstats1_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_lfstats1_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_lfstats1_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_lfstats1_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  - name: CMS_btag_lfstats2_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_lfstats2_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_lfstats2_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_lfstats2_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  - name: CMS_btag_hfstats1_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_hfstats1_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_hfstats1_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_hfstats1_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  - name: CMS_btag_hfstats2_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_btag_hfstats2_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_btag_hfstats2_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_btag_hfstats2_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  - name: CMS_btag_cferr1
    type: shape

  - name: CMS_btag_cferr2
    type: shape

  # DY reweighting (hh2bbtautau derivation). Scoped to DY: the correction is
  # configured with a processes: list, so it is a no-op everywhere else.
  # The per-era fit's statistical uncertainty is decorrelated by era; the two
  # fit-model variations are correlated.
  - name: CMS_bbww_dy_stat_btag0_2022
    type: shape
    processes:
      - DY
    eras:
      - Run3_2022
  - name: CMS_bbww_dy_stat_btag0_2022EE
    type: shape
    processes:
      - DY
    eras:
      - Run3_2022EE
  - name: CMS_bbww_dy_stat_btag0_2023
    type: shape
    processes:
      - DY
    eras:
      - Run3_2023
  - name: CMS_bbww_dy_stat_btag0_2023BPix
    type: shape
    processes:
      - DY
    eras:
      - Run3_2023BPix
  - name: CMS_bbww_dy_stat_btag1_2022
    type: shape
    processes:
      - DY
    eras:
      - Run3_2022
  - name: CMS_bbww_dy_stat_btag1_2022EE
    type: shape
    processes:
      - DY
    eras:
      - Run3_2022EE
  - name: CMS_bbww_dy_stat_btag1_2023
    type: shape
    processes:
      - DY
    eras:
      - Run3_2023
  - name: CMS_bbww_dy_stat_btag1_2023BPix
    type: shape
    processes:
      - DY
    eras:
      - Run3_2023BPix
  - name: CMS_bbww_dy_stat_btag2_2022
    type: shape
    processes:
      - DY
    eras:
      - Run3_2022
  - name: CMS_bbww_dy_stat_btag2_2022EE
    type: shape
    processes:
      - DY
    eras:
      - Run3_2022EE
  - name: CMS_bbww_dy_stat_btag2_2023
    type: shape
    processes:
      - DY
    eras:
      - Run3_2023
  - name: CMS_bbww_dy_stat_btag2_2023BPix
    type: shape
    processes:
      - DY
    eras:
      - Run3_2023BPix
  - name: CMS_bbww_dy_syst_gauss
    type: shape
    processes:
      - DY
  - name: CMS_bbww_dy_syst_linear
    type: shape
    processes:
      - DY

  # AK8 BTagging
  - name: CMS_bbww_ak8_Hbb_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_bbww_ak8_Hbb_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_bbww_ak8_Hbb_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_bbww_ak8_Hbb_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_bbww_ak8_Hcc_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_bbww_ak8_Hcc_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_bbww_ak8_Hcc_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_bbww_ak8_Hcc_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_bbww_ak8_tau21_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_bbww_ak8_tau21_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_bbww_ak8_tau21_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_bbww_ak8_tau21_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  - name: CMS_scale_j_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_scale_j_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_scale_j_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_scale_j_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  - name: CMS_res_j_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_res_j_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_res_j_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_res_j_2023BPix
    type: shape
    eras:
      - Run3_2023BPix
  - name: CMS_scale_e_2022
    type: shape
    eras:
      - Run3_2022
  - name: CMS_scale_e_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: CMS_scale_e_2023
    type: shape
    eras:
      - Run3_2023
  - name: CMS_scale_e_2023BPix
    type: shape
    eras:
      - Run3_2023BPix

  # Parton shower ISR/FSR. No `eras:` and no `processes:` -- one correlated nuisance
  # each, applied to every process including signal, because it is one Pythia shower
  # setting varied in every sample. Shape-only: the inclusive yield is normalised away
  # in the producer, so what reaches the card is acceptance alone.
  #
  # Expect ps_fsr to be resolved to lnN or dropped in some categories by autolnNThr /
  # ignorelnNThr. For a shape-only nuisance that is correct: a category whose acceptance
  # barely moves should drop out.
  - name: ps_isr
    type: shape
  - name: ps_fsr
    type: shape


  # For multiple values, Konstantin says do [ down, up ]
  - name: QCD_scale_TT
    type: lnN
    processes:
      - TT
    value: [ -0.036, 0.025 ] # TT XS uncertainty in percentage from xsec yaml
    # TT:
    # crossSec: '923.6'
    # reference: https://twiki.cern.ch/twiki/bin/view/LHCPhysics/TtbarNNLO#Updated_reference_cross_sections
    # unc: +22.6 -33.4 (scale) +/-  22.8 (PDF alphas) -24.6 +25.4 (mass) (to be multiplied by the BR)

  - name: QCD_scale_DY
    type: lnN
    processes:
      - DY
    value: [ -0.011, 0.007 ] # DY XS uncertainty in percentage from xsec yaml
    # DY_NNLO_QCD+NLO_EW:
    # crossSec: 2094.2 * 3
    # reference: https://twiki.cern.ch/twiki/bin/viewauth/CMS/MATRIXCrossSectionsat13p6TeV
    # unc: +0.7% - 1.1%, +- 1.0% PDF alphas

  - name: QCD_scale_ST
    type: lnN
    processes:
      - ST
    value: [ -0.022, +0.022 ]
    # Taken from ST to tW (largest uncertainty on XS) needs to be updated for each decay process later

  - name: QCD_scale_VV
    type: lnN
    processes:
      - VV
    # WARNING: this is not a QCD scale uncertainty. XSDB's `unc` field is an absolute
    # uncertainty in pb on its own Monte-Carlo integration, and 0.005 is just that
    # number divided by the cross section (WW 0.3733/80.23 = 0.47%, WZ 0.1318/29.1 =
    # 0.45%, ZZ 0.0649/12.75 = 0.51%; FLAF/config/crossSections13p6TeV.yaml:1051-1209).
    # The real NNLO diboson scale uncertainty is several percent. Needs replacing with a
    # number from the diboson theory reference; left as-is rather than guessed.
    value: 0.005

  - name: PDF_alphas
    hasMultipleValues: True
    type: lnN
    value:
      - value: 0.025
        type: lnN
        processes:
          - TT
      - value: 0.01
        type: lnN
        processes:
          - DY
      - value: 0.027
        type: lnN
        processes:
          - ST

  - name: top_mass
    hasMultipleValues: True
    type: lnN
    value:
      - value: [ -0.027, 0.028 ]
        type: lnN
        processes:
          - TT
      - value: [ -0.015, 0.015 ] # Taken from tW for now (largest unc percentage)
        type: lnN
        processes:
          - ST

  # Higgs branching ratios: theory, so correlated across every era -- no `eras:` field,
  # which is what makes them apply everywhere. Values from
  # https://gitlab.cern.ch/hh/naming-conventions#experimental-uncertainties
  #
  # XtoHHto2B2W_1L is the single-lepton signal and is not a process of this dilepton
  # card; it belongs in these lists when the SL card gains them. Single Higgs and VH
  # likewise, once they are added as processes.
  #
  # The process patterns are regexes (a `processes:` entry beginning with ^ is matched
  # with re.match, anything else compared literally). They have to be: by the time an
  # uncertainty is matched, the signal's ${MX} has been resolved to the mass being built,
  # so the process is XtoHHto2B2W_2L_700 and a literal "XtoHHto2B2W_2L_${MX}" matches
  # nothing at all -- silently, since an uncertainty that applies to no process is simply
  # never added.
  - name: BR_hbb
    type: lnN
    processes:
      - ^XtoHHto2B2W_2L_
      - ^XtoHHto2Tau2B_
    value: [ -0.0126, 0.0124 ]
  - name: BR_hww
    type: lnN
    processes:
      - ^XtoHHto2B2W_2L_
    value: [ -0.0152, 0.0153 ]
  - name: BR_htt
    type: lnN
    processes:
      - ^XtoHHto2Tau2B_
    value: [ -0.0163, 0.0165 ]

autolnNThr: 0.1
asymlnNThr: 0.001
ignorelnNThr: 0.001
autoMCStats:
  apply: true
  threshold: 20
  apply_to_signal: true
  mode: 1

campaigns:
  Run3_Early: run3_early
  Run3_2022: "2022preEE"
  Run3_2022EE: "2022postEE"
  Run3_2023: "2023preBPix"
  Run3_2023BPix: "2023postBPix"

limit_plots:
  - name: run3_vs_run2
    # Draw 1/2 sigma bands
    bands: true
    datacards:
      - { name: "Early Run 3", glob: "*.txt" }
    lumi_projections:
      - name: "Early Run 3 scaled to 138 fb^{-1}"
        lumi_target: 138
    external_limits:
      - config/Datacards/run2_spin0_DL_external_limits.json
    plot_params: &limit_plot_style
      xsec: pb
      y_log: true
      x_min: 200
      x_max: 1000
      y_min: 0.001
      y_max: 100

  - name: channels
    datacards:
      - { name: "Combined", glob: "*.txt" }
      - { name: "ee", glob: "${ERA}/eE/*.txt" }
      - { name: "e#mu", glob: "${ERA}/eMu/*.txt" }
      - { name: "#mu#mu", glob: "${ERA}/muMu/*.txt" }
    external_limits:
      - config/Datacards/run2_spin0_DL_external_limits.json
    plot_params: *limit_plot_style

  - name: categories
    datacards:
      - { name: "Combined", glob: "*.txt" }
      - { name: "res 2b", glob: "${ERA}/categories/SR_res2b/*.txt" }
      - { name: "recovery", glob: "${ERA}/categories/SR_recovery/*.txt" }
      - { name: "boosted", glob: "${ERA}/categories/SR_boosted/*.txt" }
    external_limits:
      - config/Datacards/run2_spin0_DL_external_limits.json
    plot_params: *limit_plot_style

# Nuisance pulls and impacts, drawn by PlotPullsAndImpactsTask into
# <version>/ImpactPlots/<name>/<era>/<mass>/.
#
# This entry has no `glob:`, so it uses the combined card ResonantLimitsTask writes --
# every era and every category in one fit. To rank one category instead, give an entry a
# glob addressing its card, e.g.
#
#   - name: res2b
#     glob: "${ERA}/categories/SR_res2b/*.txt"
#
# The glob and the mass must select exactly one card: PullsAndImpacts fits a single
# workspace.
impact_plots:
  - name: combined
    masses: [ 300, 600, 800 ]
    # The Asimov dataset is built at this signal strength. It has to be near the limit to
    # mean anything: dhi's default is r=1, which at 300 (limit ~6.8) is an almost
    # invisible signal so the ranking is really the background-only one, and at 800
    # (limit ~0.065) is ten times more signal than can be excluded, which pins r and
    # collapses every impact towards zero. "limit" takes the expected limit at each mass
    # from the limits already merged for these cards; a number sets it explicitly.
    #
    # It reaches combine as --expectSignal through PullsAndImpacts' custom_args. It cannot
    # go through dhi's `parameter_values`: for a resonant search hh_model is NO_STR, and
    # POITask then hard-codes the joined parameter values to '""' and the output postfix
    # to r=1.0, so the value would be dropped without a word.
    #
    # WARNING: the fit's output path does not depend on it -- custom_args is significant
    # for task identity but not for the store path -- so changing this value does not move
    # the outputs. Clear <version>/PullsAndImpacts, MergePullsAndImpacts and
    # PlotPullsAndImpacts under inference/data/store before re-running with a different
    # one, or law will report the old fit as complete.
    poi_value: limit
    # Migrad fails on a few of these fits from a bad seed gradient -- at 300 it was
    # CMS_eff_m_id_iso_2023 -- and dhi aborts the whole merge rather than the branch, so
    # 80 converged fits produce nothing. MINIMIZER_no_analytic, which dhi suggests, tends
    # to move the failure to another parameter; falling back to Simplex converges it.
    # Anything here reaches combine through PullsAndImpacts' custom_args.
    fit_args:
      - --cminFallbackAlgo Minuit2,Simplex,0:0.1
    plot_params:
      # One combine job per nuisance per direction. `robust` would instead take a single
      # fit and invert the Hessian, which is far cheaper but drops any parameter it cannot
      # invert -- it silently lost all four CMS_scale_j_* on these cards. Per-parameter
      # fits are what a ranking should be built from.
      method: default
      order_by_impact: true
      # mc_stats would add a few hundred autoMCStats bins. If you turn it on, set
      # parameters_per_page as well (25 works) or the plot is one unreadable page -- the
      # task refuses the combination rather than drawing it.
      mc_stats: false
