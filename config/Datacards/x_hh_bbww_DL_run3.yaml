  # Ele Trigger
  - name: SingleEleTrg_2022
    type: shape
    eras:
      - Run3_2022
  - name: SingleEleTrg_2022EE
    type: shape
    eras:
      - Run3_2022EE
  - name: SingleEleTrg_2023
    type: shape
