analysis: hh_bbww
type: resonant
model:
  parameters: [ MX ]
  param_dependent_bkg: true
  # The binary score of the two-stage single-lepton DNN, 1D.
  input_file_pattern: ${ERA}/TwoStageDNN_M${MX}_binary/TwoStageDNN_M${MX}_binary.root
signalFractionForRelevantBins: 0.2
eras:
  - Run3_2022
  - Run3_2022EE
  - Run3_2023
  - Run3_2023BPix
channels:
  - e
  - mu
# The single-lepton CI card: what it tests is the per-mass input categories. Each mass
# hypothesis MX has its own signal region, SR_SL_M${MX} (the events its multiclass DNN
# classifies as signal), and every file holds all of them; the datacard categories keep
# one name and are read from the MX one. See x_hh_bbww_SL_run3.yaml.
categories:
  - SR/res2b
  - SR/recovery
input_categories:
  SR/res2b: SR_SL_M${MX}/res2b
  SR/recovery: SR_SL_M${MX}/recovery

# One bin per channel and category, for the reason CI_card.yaml gives: at --test
# statistics a per-bin distribution is mostly empty or negative. No preprocess step --
# the maker rebins, which leaves the rebinning out of what this card tests.
hist_bins: [ 0.0, 1.0 ]

processes:
  - process: data_obs
    is_data: true
    is_asimov_data: true
  # The one-lepton CI signal (custom_CI_Signal_SL); the two-lepton one is DL-only.
  - process: XtoHHto2B2W_1L_${MX}
    hist_name: XtoHHto2B2W_1L_${MX}
    param_values: [ 300 ]
    is_signal: true
  # Only the t#bar{t} background. custom_CI_Background_DY is produced, merged, histogrammed
  # and plotted by the integration test, but it is not valid input for a limit here: it is an
  # amc@NLO sample, so it carries negative event weights, and `--test 1000` leaves too few
  # events for them to cancel — the single-bin histogram came out -1669 +/- 2817, compatible
  # with zero at 0.6 sigma but negative, which makes the datacard job flaky by construction.
  # The CI t#bar{t} is TTto2L2Nu + TTtoLNu2Q; at --test statistics a category can still be empty.
  - process: custom_CI_Background_TT
    allow_zero_integral: true
uncertainties:
  # Split per year rather than per era: the luminosity calibration is a per-year
  # measurement, so 2022 and 2022EE share a nuisance and 2023 and 2023BPix share
  # another. This is lnN, so it needs nothing from the producer -- the meta-era lnN
  # path already evaluates `eras:` against the sub-eras.
  #
  # NOTE: both magnitudes are still the old flat 1.4%. Only the correlation model has
  # been fixed here; the per-year values need to be taken from the current LUM
  # recommendation (which also splits a correlated from an uncorrelated component,
  # not implemented here).
  - name: lumi_13p6TeV_2022
    type: lnN
    eras:
      - Run3_2022
      - Run3_2022EE
    value: 0.014 # https://twiki.cern.ch/twiki/bin/view/CMS/LumiRecommendationsRun3
  - name: lumi_13p6TeV_2023
    type: lnN
    eras:
      - Run3_2023
      - Run3_2023BPix
    value: 0.014 # TODO: per-year LUM value


