analysis: hh_bbww
type: resonant
model:
  parameters: [ MX ]
  param_dependent_bkg: true
  # The two-stage SL DNN: a multiclass per mass hypothesis assigns each event to the
  # signal region or to a background-class region, and the binary signal-vs-background
  # score of the same hypothesis is the fitted discriminant. 1D -- there is no HME axis
  # in these shapes.
  input_file_pattern: ${ERA}/TwoStageDNN_M${MX}_binary/TwoStageDNN_M${MX}_binary.root
signalFractionForRelevantBins: 0.2
# One limit on all four datasets combined, as for DL. The sub-eras stay in era_groups
# because Run3_Early is their combination; they are not built standalone.
eras:
  - Run3_Early
era_groups:
  Run3_Early:
    - Run3_2022
    - Run3_2022EE
    - Run3_2023
    - Run3_2023BPix
channels:
  - e
  - mu
# The datacard categories, named as DL's are. No rebinning step yet: the shapes are read
# as produced (the binary DNN score, 100 bins), so this card exercises input_categories on
# its own. The HME-box binning and the SL+DL combination follow in later PRs.
categories:
  - SR/res2b
  - SR/boosted
  - SR/recovery
# Where each category is read from. The file for mass MX holds a signal region for every
# mass hypothesis (SR_SL_M300 ... SR_SL_M1000), since every event is classified by every
# mass's multiclass; the one that belongs to the MX limit is SR_SL_M${MX}. The category
# keeps one name for every mass -- the bin, the per-category cards, the scoping below --
# and only the read is redirected. Listing the SR_SL_M* directories as categories instead
# would put all ten into every card as separate bins: every file has all of them.
input_categories:
  SR/res2b: SR_SL_M${MX}/res2b
  SR/boosted: SR_SL_M${MX}/boosted
  SR/recovery: SR_SL_M${MX}/recovery

processes:
  - process: data_obs
    is_data: true
    is_asimov_data: true

  # The spin-0 (Radion) X->HH signal, both samples, one signal strength, unscaled: the limit
  # is on sigma(pp->X) * B(X->HH), in pb, as in DL. The samples are split by the generated
  # decay, not by channel -- a two-lepton event that loses a lepton is selected here.
  # A spin-2 card is this file with GluGluToBulkGraviton_bbWW_* in place of GluGluToRadion_bbWW_*.
  # The masses are those the SL DNN was trained on: the inputs hold SR_SL_M${MX} for these only.
  - process: GluGluToRadion_bbWW_1L_${MX}
    hist_name: GluGluToRadion_bbWW_1L_${MX}
    param_values: [ 300, 400, 500, 550, 600, 650, 700, 800, 900, 1000 ]
    is_signal: true
    allow_zero_integral: true
  - process: GluGluToRadion_bbWW_2L_${MX}
    hist_name: GluGluToRadion_bbWW_2L_${MX}
    param_values: [ 300, 400, 500, 550, 600, 650, 700, 800, 900, 1000 ]
    is_signal: true
    allow_zero_integral: true
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
  # bbtautau is commented out until the private X->HH->bbtautau samples exist, as in DL.
  # - process: XtoHHto2Tau2B_${MX}
  #   hist_name: XtoHHto2Tau2B_${MX}
  #   param_values: [ 300, 400, 500, 550, 600, 650, 700, 800, 900, 1000 ]
  #   is_signal: true
  #   allow_zero_integral: true
  #   allow_negative_bins_within_error: true
  #   max_n_sigma_for_negative_bins: 2
  - process: TT
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
  - process: W
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
  - process: ST
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
  - process: DY
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
    allow_zero_integral: true
  - process: VV
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
    allow_zero_integral: true
  - process: H
    allow_negative_bins_within_error: true
    max_n_sigma_for_negative_bins: 2
    allow_zero_integral: true

uncertainties:
  # Luminosity, as the Run 3 recommendation splits it: one component correlated across
  # all four eras but with a different size in each year group, and a second carried by
  # 2023 alone. Not a per-year uncorrelated pair -- that would treat the two year groups
  # as independent, which they are not.
  #
  # lumi_1 is one nuisance whose value depends on the era. Under a meta-era the datacard
  # maker cannot express that as a single lnN on the summed yield, so it builds the
  # variation sub-era by sub-era and writes it as a shape; each sub-era contributes its
  # own factor, and the ratio to nominal comes out as the yield-weighted blend.
  #
  # Reference: https://twiki.cern.ch/twiki/bin/viewauth/CMS/LumiRecommendationsRun3?extralog=-%20caching%20topic#Correlations_between_years_and_c
  - name: lumi_1_13p6TeV
    hasMultipleValues: True
    type: lnN
    value:
      - value: 0.0138
        type: lnN
        eras:
          - Run3_2022
          - Run3_2022EE
      - value: 0.0017
        type: lnN
        eras:
          - Run3_2023
          - Run3_2023BPix
  - name: lumi_2_13p6TeV
    type: lnN
    eras:
      - Run3_2023
      - Run3_2023BPix
    value: 0.0127

