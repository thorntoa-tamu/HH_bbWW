# The signals are the X->HH samples, bbWW and bbtautau: central where DAS has the mass point,
# privately produced (DSProd, models/X_HH/setups/Run3_XHHbbWW.yaml and Run3_XHHbbtautau.yaml)
# otherwise. The central X->YH samples (XtoYHto*) are not selected. Run3_Model carries every
# signal hypothesis: anaTuple and histogram production branch
# per dataset, and the merged histogram is named by the expanded process
# (GluGluToRadion_bbWW_2L_300, GluGluToBulkGraviton_bbWW_1L_1000, ...), so two hypotheses
# are not added into one histogram. Which hypothesis a fit uses is the datacard's process list, not a second physics
# model. No resonant sample is produced in Run3_2024 and later: the meta-processes are declared
# there with an empty dataset list, so those eras keep loading.
Run3_Model:
  name: "Base model for Run 3"
  backgrounds:
    - TT
    - DY
    - ST
    - VV
    - VVV
    - ttV
    - W
    - H
    # - QCD_PT
  signals:
    - GluGluToRadion_bbWW_1L
    - GluGluToRadion_bbWW_2L
    - GluGluToBulkGraviton_bbWW_1L
    - GluGluToBulkGraviton_bbWW_2L
    - GluGluToRadion_bbTauTau
    - GluGluToBulkGraviton_bbTauTau
  data:
    - Data_Full

OnlyData:
  name: "Only Data"
  backgrounds: [ ]
  signals: [ ]
  data:
    - Data_Full

TestModel:
  name: "Test model for CI"
  backgrounds:
    - custom_CI_Background_TT
    - custom_CI_Background_DY
    - custom_CI_Background_W
  signals: # WARNING: for 2024 no signal sample available, using a file from bbtt signals..
    - custom_CI_Signal
    - custom_CI_Signal_SL
  data:
    - custom_CI_Data

DNNTest_Model:
  name: "Model two stage dnn test"
  backgrounds: [ ]
  signals:
    - XtoHHto2B2W_SingleLepton_DNN
  data: [ ]

DNNTraining_Model:
  name: "Base model for Run 3"
  backgrounds:
    - TT
    - DY
    - ST
    - VV
    - W
    - H
    # - QCD_PT
  signals:
    # Radion X->HH only. The central X->YH processes (XtoHHto2B2W_*) are not selected.
    - GluGluToRadion_bbWW_2L
    - GluGluToRadion_bbWW_1L
    - GluGluToRadion_bbTauTau
  data:
    - Data_Full
