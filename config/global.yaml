anaTupleDef: AnaProd/anaTupleDef.py
histTupleDef: Analysis/histTupleDef.py
analysis_import: Analysis.hh_bbww
analysis_cache_import: Analysis.tasks:AnalysisCacheTask:AnalysisCacheMergeTask
phys_model: Run3_Model

bundles:
  # Code and configuration: hashed, so that editing any of it produces a different bundle
  # instead of jobs silently running whatever was packed the first time.
  core:
    period_specific: false
    hashed: true
    patterns:
      - FLAF
      - AnaProd
      - Analysis
      - config
      - env.sh
      - Corrections
      - DeepHME
      - Studies
      - include
  # The installed environment: large, and only ever changes on a reinstall, so it is kept
  # out of the hashed bundle.
  soft:
    period_specific: false
    patterns:
      - soft/flaf_env
  cmssw:
    period_specific: false
    patterns:
      - soft/CMSSW_16_0_6
  inputFileList:
    period_specific: true
    patterns:
      - data/{version}/InputFileTask/{period}
    task_requires:
      module: FLAF.AnaProd.tasks
      class: InputFileTask
  AnaTupleFileList:
    period_specific: true
    patterns:
      - data/{version}/AnaTupleFileListBuilderTask/{period}
      - data/{version}/AnaTupleFileListTask/{period}
    # Both producers, or the bundle is packed as soon as the builder is done, while the
    # per-dataset lists of AnaTupleFileListTask are still being written.
    task_requires:
      - module: FLAF.AnaProd.tasks
        class: AnaTupleFileListBuilderTask
      - module: FLAF.AnaProd.tasks
        class: AnaTupleFileListTask
  inference:
    period_specific: false
    patterns:
      - inference
      - StatInference

WLCGFileSystem:
  remotePathCacheHost: cms-flaf.cern.ch
  remotePathCachePort: 5000
  localPathCacheValidity: 600
  verbose: 0

runTokenServer:
  host: cms-flaf.cern.ch
  port: 5007

nEventsPerFile:
  data: 1000000
  signals: 100000
  backgrounds: 100000

corrections:
  mu:
    stages: [ HistTuple, AnalysisCache ]
    columns:
      pfRelIso04_all: Muon_pfRelIso04_all
      tightId: Muon_tightId
      tkRelIso: Muon_tkRelIso
      highPtId: Muon_highPtId
      mediumId: Muon_mediumId
      looseId: Muon_looseId
  trigger:
    stages: [ HistTuple, AnalysisCache ]
    mode: SF
  ele: { stages: [ HistTuple, AnalysisCache ] }
  fatjet:
    stages: [ HistTuple, AnalysisCache ] # AnaTuple
    ana: bbWW
    tagger: particleNetWithMass_HbbvsQCD
    fatJetName: fatbjet # SelectedFatJet
  muScaRe: {
    stage: AnaTuple,
    mu_pt_for_ScaReApplication: "nano",
    selection: "Muon_looseId",
  }
  eleES: { stages: [ AnaTuple, AnalysisCache ] }
  lumi: { stage: AnaTuple }
  xs: { stage: AnaTuple }
  gen: { stage: AnaTuple }
  pu:
    stages: [ AnaTuple, AnaTupleMerge ]
    enabled:
      AnaTuple: true
      AnaTupleMerge: false
  # Parton-shower ISR/FSR. Stages mirror pu because the mechanism is the same one: the
  # weights are defined at AnaTuple, where the inclusive sums of
  # weight_gen * weight_pu_Central * weight_ps_<var> are accumulated into the anaCache
  # denominators, and AnaTupleMerge reads the persisted branches back to build
  # weight_base_isr{Up,Down}_rel / weight_base_fsr{Up,Down}_rel. Dividing each variation
  # by its own denominator is what makes the nuisance shape-only.
  #
  # AnaTupleMerge must stay disabled: the merged tuple holds PS_Weight, not PSWeight, so
  # an enabled producer there would hit its missing-input path. It raises rather than
  # shadowing the persisted values, but the config is what should prevent it.
  #
  # No `processes:` -- applied to all MC including signal, which is what makes ps_isr
  # and ps_fsr single correlated nuisances. It is one Pythia shower setting.
  parton_shower:
    stages: [ AnaTuple, AnaTupleMerge ]
    branch: PSWeight
    enabled:
      AnaTuple: true
      AnaTupleMerge: false
  base: { stage: AnaTupleMerge }
  JEC: { stage: AnaTuple }
  JER:
    stage: AnaTuple
    apply_jet_horns_fix: true
  btag:
    normCacheProducer: BtagShape
    stages: [ AnaTuple, HistTuple, AnalysisCache ]
    modes:
      AnaTuple: none # just load to define WP ID branches
      AnalysisCache: shape
      HistTuple: shape_and_norm
    tagger: particleNet
    jetCollection: centralJet
  # dy_hhbbww:
  #   stages: [ AnalysisCache, HistTuple ]
  #   processes: [ DY_M_10to50, DYto2L_InclusivePlusBinned ]
  #   njets_branch: Njets # Use nCentralJets, not raw nJet
  #   pt_ll: ll_pt
  dy_hhbbtautau:
    stages: [ AnalysisCache, HistTuple ]
    processes: [ DY_M_10to50, DYto2L_InclusivePlusBinned ]
    njets_branch: Njets # Use nCentralJets, not raw nJet
    ntags_branch: nBTaggedJets
    pt_ll_gen: ll_pt_gen
