fs_default:
  - /builds/cms-flaf/flaf_integration/output/HH_bbWW

analysis_config_area: config
compute_unc_variations: true
compute_unc_histograms: true
store_noncentral: true
phys_model: TestModel
# The trimmed variable set in global.yaml; `default` runs the CI pod out of memory.
histTuple_flavor: CI

QCDRegions:
  - OS_Iso
  # The single-lepton signal region of the MX=300 hypothesis, read by CI_card_SL.yaml.
  - SR_SL_M300

StatInference:
  # TEMPORARY: the CI builds the single-lepton card, which exercises the per-mass input
  # categories (StatInference#24). One invocation can build one datacard configuration
  # until the combination support lands (StatInference PR "SL_DL_Cards"); then both run,
  # and the double-lepton card below comes back.
  config: config/Datacards/CI_card_SL.yaml
  # config: config/Datacards/CI_card.yaml
  # hist_bins is unset, as in global.yaml: CI_card.yaml declares a `preprocess:` step,
  # so the shapes reaching the datacard maker are already at their final binning -- one
  # bin per channel and category, per CI_binning_2d.yaml. CI_card_SL.yaml sets its own.
  param_values: [ 300 ]

