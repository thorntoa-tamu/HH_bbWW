fs_default:
  - /builds/cms-flaf/flaf_integration/output/HH_bbWW

analysis_config_area: config
compute_unc_variations: true
compute_unc_histograms: true
store_noncentral: true
phys_model: TestModel

QCDRegions:
  - OS_Iso

StatInference:
  config: config/Datacards/CI_card.yaml
  # hist_bins is unset, as in global.yaml: CI_card.yaml declares a `preprocess:` step,
  # so the shapes reaching the datacard maker are already at their final binning -- one
  # bin per channel and category, per CI_binning_2d.yaml.
  param_values: [ 300 ]

