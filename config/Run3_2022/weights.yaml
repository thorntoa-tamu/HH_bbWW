norm:
  PileUp_Lumi_MC:
    expression: weight_base_pu{scale}_rel  * final_weight
    name: CMS_pileup_2022_{}

  MuonID_SF_Iso_ID:
    expression: weight_lep1_MuonID_SF_TightPFIso_TightID{scale}_rel * weight_lep2_MuonID_SF_TightPFIso_TightID{scale}_rel * final_weight
    name: CMS_eff_m_id_iso_2022_{}
  MuonID_SF_ID:
    expression: weight_lep1_MuonID_SF_TightID_Trk{scale}_rel * weight_lep2_MuonID_SF_TightID_Trk{scale}_rel * final_weight
    name: CMS_eff_m_id_2022_{}

  EleID_TightIDIso:
    expression: weight_lep1_EleSF_wp80iso_EleID{scale}_rel * weight_lep2_EleSF_wp80iso_EleID{scale}_rel * final_weight
    name: EleID_TightIDIso_2022_{}

  SingleEleTrg:
    expression: weight_lep1_TrgSF_singleEleWpTight_singleEle{scale}_rel * weight_lep2_TrgSF_singleEleWpTight_singleEle{scale}_rel * final_weight
    name: SingleEleTrg_2022_{}
  SingleMuonTrg:
    expression: weight_lep1_TrgSF_singleIsoMu_IsoMu24{scale}_rel * weight_lep2_TrgSF_singleIsoMu_IsoMu24{scale}_rel * final_weight
    name: SingleMuonTrg_2022_{}

  bTagShape_lf:
    expression: "(boosted ? 1.0f : weight_bTagShape_lf{scale}_rel) * final_weight"
    name: CMS_btag_LF_{}
  bTagShape_hf:
    expression: "(boosted ? 1.0f : weight_bTagShape_hf{scale}_rel) * final_weight"
    name: CMS_btag_HF_{}
  bTagShape_lfstats1:
    expression: "(boosted ? 1.0f : weight_bTagShape_lfstats1{scale}_rel) * final_weight"
    name: CMS_btag_lfstats1_2022_{}
  bTagShape_lfstats2:
    expression: "(boosted ? 1.0f : weight_bTagShape_lfstats2{scale}_rel) * final_weight"
    name: CMS_btag_lfstats2_2022_{}
  bTagShape_hfstats1:
    expression: "(boosted ? 1.0f : weight_bTagShape_hfstats1{scale}_rel) * final_weight"
    name: CMS_btag_hfstats1_2022_{}
  bTagShape_hfstats2:
    expression: "(boosted ? 1.0f : weight_bTagShape_hfstats2{scale}_rel) * final_weight"
    name: CMS_btag_hfstats2_2022_{}
  bTagShape_cferr1:
    expression: "(boosted ? 1.0f : weight_bTagShape_cferr1{scale}_rel) * final_weight"
    name: CMS_btag_cferr1_{}
  bTagShape_cferr2:
    expression: "(boosted ? 1.0f : weight_bTagShape_cferr2{scale}_rel) * final_weight"
    name: CMS_btag_cferr2_{}

  DYw_stat_btag0:
    requires: dy_hhbbtautau
    expression: weight_dy_stat_btag0_{scale}_rel * final_weight
    name: CMS_bbww_dy_stat_btag0_2022_{}
  DYw_stat_btag1:
    requires: dy_hhbbtautau
    expression: weight_dy_stat_btag1_{scale}_rel * final_weight
    name: CMS_bbww_dy_stat_btag1_2022_{}
  DYw_stat_btag2:
    requires: dy_hhbbtautau
    expression: weight_dy_stat_btag2_{scale}_rel * final_weight
    name: CMS_bbww_dy_stat_btag2_2022_{}
  DYw_syst_gauss:
    requires: dy_hhbbtautau
    expression: weight_dy_syst_gauss_{scale}_rel * final_weight
    name: CMS_bbww_dy_syst_gauss_{}
  DYw_syst_linear:
    requires: dy_hhbbtautau
    expression: weight_dy_syst_linear_{scale}_rel * final_weight
    name: CMS_bbww_dy_syst_linear_{}

  fatJetSF_Hbb:
    expression: "(boosted ? weight_FatJetSF_Hbb{scale}_rel : 1.0f) * final_weight"
    name: CMS_bbww_ak8_Hbb_2022_{}
  fatJetSF_Hcc:
    expression: "(boosted ? weight_FatJetSF_Hcc{scale}_rel : 1.0f) * final_weight"
    name: CMS_bbww_ak8_Hcc_2022_{}
  fatJetSF_tau21:
    expression: "(boosted ? weight_FatJetSF_tau21{scale}_rel : 1.0f) * final_weight"
    name: CMS_bbww_ak8_tau21_2022_{}

  PS_ISR:
    expression: weight_base_isr{scale}_rel * final_weight
    name: ps_isr_{}
  PS_FSR:
    expression: weight_base_fsr{scale}_rel * final_weight
    name: ps_fsr_{}

shape:
  JER:
    name: CMS_res_j_2022_{}
  JES_Total:
    name: CMS_scale_j_2022_{}
  EleES:
    name: CMS_scale_e_2022_{}
  EleSmear:
    name: CMS_res_e_2022_{}
  ScaRe:
    name: CMS_ScaRe_mu_2022_{}
