name: Check repository state

on:
  pull_request:
    types: [ "opened", "synchronize", "reopened", "labeled" ]
    workflow_call:

permissions:
  contents: read
  checks: write

jobs:
  sanity-checks:
    uses: cms-flaf/FLAF/.github/workflows/repo-sanity-checks.yaml@main
    secrets: inherit

  # The period -> era rename (multi-era change set): no leftover in this repository's files.
  # The check lives in FLAF.
  era-rename-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the check
        uses: actions/checkout@v4
        with:
          repository: cms-flaf/FLAF
          # A fixed FLAF commit: the checker's rules change with FLAF, and this repository adopts
          # a new rule set by moving the pin, in a change that also fixes what the new rules find.
          ref: 4d9602cdbcdf6d09ba4566b4f83e3878e39975ca
          path: flaf_check
          sparse-checkout: run_tools/check_era_rename.py
          sparse-checkout-cone-mode: false
      - name: No leftover of the period -> era rename
        run: python3 flaf_check/run_tools/check_era_rename.py --repo .
