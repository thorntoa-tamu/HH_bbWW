# HistTuples per era: a local path or an xrootd URL.
# 2022/2022EE were produced on LPC, 2023/2023BPix by Artem in his CERN EOS area.
storage_folders:
  Run3_2022: root://cmseos.fnal.gov//store/user/lpcflaf/HH_bbWW/v2610_training/HistTuples/Run3_2022
  Run3_2022EE: root://cmseos.fnal.gov//store/user/lpcflaf/HH_bbWW/v2610_training/HistTuples/Run3_2022EE
  Run3_2023: /eos/user/a/abolshov/HH_bbWW/v2610_training/HistTuples/Run3_2023
  Run3_2023BPix: /eos/user/a/abolshov/HH_bbWW/v2610_training/HistTuples/Run3_2023BPix

nParity: 4

# Training-file branches: all HistTuple columns, plus add_extra_vars (p4 components etc.) when true
extra_vars: false

# nParity{k}_Merged_weight.root (all_masses) and/or nParity{k}_Merged_weight_m{mass}.root per mass of per_mass_signal.
# Not needed by the PyTorch training (it weights events from weight_Central itself, see
# Studies/DNN_pytorch/model_configs/v2610_pDNN_v1.yaml); the first v2610 production wrote all_masses.
weight_files:
  all_masses: false
  per_mass_signal: null

# Cuts for RDF in creating the training file
iterate_cut: (
  (SR == 1) &&
  ( (res2b == 1) || (recovery == 1) || (boosted == 1) ) &&
  ( (channelId == 11) || (channelId == 12) || (channelId == 22) )
  )
parity_cut: (
  (event%{nParity} == {parity_scan})
  )

signal:
  # v2610 produces the X->HH signals only; the central X->YH samples are not selected
  # (config/phys_models.yaml). Every mass 250-5000 exists for Radion and BulkGraviton in all 4 eras.
  # All signals (class_value <= 0) get class_target 0 in the weight files.
  GluGlutoRadion_2L:
    class_value: 0
    spin: 0
    mass_points: [ 250, 260, 270, 280, 300, 320, 350, 360, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000 ]
    dataset_name_format:
      GluGlutoRadiontoHHto2B2Vto2B2L2Nu_M_{}
    combined_name:
      GluGlutoRadion_2L_Combined
    use_combined:
      True

  GluGlutoRadion_1L:
    class_value: -1
    spin: 0
    mass_points: [ 250, 260, 270, 280, 300, 320, 350, 360, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000 ]
    dataset_name_format:
      GluGlutoRadiontoHHto2B2Vto2B2JLNu_M_{}
    combined_name:
      GluGlutoRadion_1L_Combined
    use_combined:
      True

  GluGlutoRadion_2Tau:
    class_value: -2
    spin: 0
    mass_points: [ 250, 260, 270, 280, 300, 320, 350, 360, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000 ]
    dataset_name_format:
      GluGlutoRadiontoHHto2B2Tau_M_{}
    combined_name:
