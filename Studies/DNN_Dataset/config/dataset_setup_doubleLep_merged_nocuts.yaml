# storage_folder: /eos/user/d/daebi/HH_bbWW/histTuples/v2601a/*/ # Include all eras with *
# storage_folder: /eos/user/d/daebi/HH_bbWW/v2605a_centrals/HistTuples/*/ # Include all eras with *
# storage_folder: /eos/user/d/daebi/HH_bbWW/v2605a_MediumBTagForReal_DNNTrainingHistTuples/HistTuples/*/ # Include all eras with *
storage_folder: /eos/user/d/daebi/HH_bbWW/v2605a_DNNTraining_Jul24/HistTuples/*/ # Include all eras with *

nParity: 4

# Training-file branches: all HistTuple columns, plus add_extra_vars (p4 components etc.) when true
extra_vars: false

# nParity{k}_Merged_weight.root (all_masses) and/or nParity{k}_Merged_weight_m{mass}.root per mass of per_mass_signal
weight_files:
  all_masses: true
  per_mass_signal: null

# Cuts for RDF in creating the training file
iterate_cut: (
  (SR == 1) &&
  ( (res2b == 1) || (recovery == 1) || (boosted == 1) ) &&
  ( (channelId == 11) || (channelId == 12) || (channelId == 22) )
  )
parity_cut: (
  (event%{nParity} == {parity_scan})
  )

signal:
  XtoYHto2B2W_2L:
    class_value: 0
    spin: 0
    mass_points: [ 300, 400, 500, 550, 600, 650, 700, 800, 900, 1000, 1200, 1400, 1600, 1800, 2000 ]
    dataset_name_format:
      XtoYHto2B2Wto2B2L2Nu_MX_{}_MY_125
